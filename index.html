<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Medicamentos</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f4f8;
  color: #20242a;
}

header {
  background: #1769aa;
  color: white;
  padding: 18px 15px;
  text-align: center;
}

header h1 {
  margin: 0 0 8px;
  font-size: 24px;
}

#relogio {
  font-size: 18px;
  font-weight: bold;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.10);
}

h2 {
  margin-top: 0;
  font-size: 19px;
}

label {
  display: block;
  margin-top: 10px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  border: 1px solid #bbb;
  border-radius: 9px;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 11px 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.btn-adicionar {
  width: 100%;
  margin-top: 15px;
  background: #1769aa;
  color: white;
}

.medicamento {
  border-left: 5px solid #1769aa;
  padding: 12px;
  margin-top: 12px;
  background: #f7f9fb;
  border-radius: 8px;
}

.nome {
  font-size: 19px;
  font-weight: bold;
}

.dose {
  margin-top: 4px;
  color: #555;
}

.horarios {
  margin-top: 8px;
}

.horario {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
  border: 1px solid #ddd;
  padding: 9px;
  margin-top: 6px;
  border-radius: 8px;
}

.horario.atrasado {
  border-left: 5px solid #d32f2f;
}

.horario.proximo {
  border-left: 5px solid #f9a825;
}

.horario.tomado {
  border-left: 5px solid #2e7d32;
  opacity: .65;
}

.info-horario {
  display: flex;
  flex-direction: column;
}

.status {
  font-size: 12px;
  margin-top: 3px;
  color: #666;
}

.btn-tomar {
  background: #2e7d32;
  color: white;
  padding: 8px 10px;
}

.btn-desfazer {
  background: #757575;
  color: white;
  padding: 8px 10px;
}

.btn-excluir {
  background: #d32f2f;
  color: white;
  margin-top: 10px;
  width: 100%;
}

.vazio {
  text-align: center;
  color: #777;
  padding: 20px 5px;
}

.proximo-geral {
  background: #fff8e1;
  border-left: 5px solid #f9a825;
}

#proximaDose {
  font-size: 18px;
  font-weight: bold;
}

small {
  color: #666;
}
</style>
</head>

<body>

<header>
  <h1>💊 Controle de Medicamentos</h1>
  <div id="relogio">00:00:00</div>
</header>

<div class="container">

  <div class="card proximo-geral">
    <h2>⏰ Próxima dose</h2>
    <div id="proximaDose">Nenhuma dose cadastrada.</div>
  </div>

  <div class="card">
    <h2>➕ Novo medicamento</h2>

    <label for="nome">Medicamento</label>
    <input id="nome" type="text" placeholder="Ex.: Mirtazapina">

    <label for="dose">Dose</label>
    <input id="dose" type="text" placeholder="Ex.: 30 mg">

    <label for="horarios">Horários</label>
    <input id="horarios" type="text" placeholder="Ex.: 08:00, 14:00, 22:00">

    <small>
      Para vários horários, separe por vírgula.
    </small>

    <button class="btn-adicionar" onclick="adicionarMedicamento()">
      ADICIONAR MEDICAMENTO
    </button>
  </div>

  <div class="card">
    <h2>📋 Meus medicamentos</h2>
    <div id="lista"></div>
  </div>

</div>

<script>

let medicamentos = JSON.parse(
  localStorage.getItem("medicamentosControle") || "[]"
);

function salvar() {
  localStorage.setItem(
    "medicamentosControle",
    JSON.stringify(medicamentos)
  );
}

function atualizarRelogio() {

  const agora = new Date();

  const hora = agora.toLocaleTimeString("pt-BR", {
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });

  document.getElementById("relogio").textContent = hora;

  atualizarStatus();
}

function adicionarMedicamento() {

  const nome = document.getElementById("nome").value.trim();
  const dose = document.getElementById("dose").value.trim();
  const horariosTexto =
    document.getElementById("horarios").value.trim();

  if (!nome) {
    alert("Digite o nome do medicamento.");
    return;
  }

  if (!horariosTexto) {
    alert("Digite pelo menos um horário.");
    return;
  }

  const horarios = horariosTexto
    .split(",")
    .map(h => h.trim())
    .filter(h => /^\d{1,2}:\d{2}$/.test(h))
    .map(h => {

      let partes = h.split(":");

      let hora = parseInt(partes[0]);
      let minuto = parseInt(partes[1]);

      if (hora > 23 || minuto > 59) {
        return null;
      }

      return {
        hora: hora,
        minuto: minuto,
        tomado: false
      };

    })
    .filter(Boolean);

  if (horarios.length === 0) {
    alert("Digite horários válidos, como 08:00 ou 22:30.");
    return;
  }

  medicamentos.push({
    id: Date.now(),
    nome: nome,
    dose: dose,
    horarios: horarios
  });

  salvar();

  document.getElementById("nome").value = "";
  document.getElementById("dose").value = "";
  document.getElementById("horarios").value = "";

  renderizar();
}

function excluirMedicamento(id) {

  const medicamento = medicamentos.find(m => m.id === id);

  if (!medicamento) return;

  const confirmar = confirm(
    "Excluir o medicamento " +
    medicamento.nome +
    "?"
  );

  if (!confirmar) return;

  medicamentos = medicamentos.filter(m => m.id !== id);

  salvar();

  renderizar();
}

function marcarTomado(id, indice) {

  const medicamento =
    medicamentos.find(m => m.id === id);

  if (!medicamento) return;

  medicamento.horarios[indice].tomado =
    !medicamento.horarios[indice].tomado;

  salvar();

  renderizar();
}

function minutosDoDia(hora, minuto) {
  return hora * 60 + minuto;8
}

function atualizarStatus() {

  const agora = new Date();

  const minutosAgora =
    agora.getHours() * 60 + agora.getMinutes();

  let proxima = null;

  medicamentos.forEach(med => {

    med.horarios.forEach((h, indice) => {

      const minutos =
        minutosDoDia(h.hora, h.minuto);

      let diferenca = minutos - minutosAgora;

      if (diferenca < 0) {
        diferenca += 1440;
      }

      if (!proxima || diferenca < proxima.diferenca) {

        proxima = {
          medicamento: med,
          horario: h,
          indice: indice,
          diferenca: diferenca
        };

      }

    });

  });

  const elemento =
    document.getElementById("proximaDose");

  if (!proxima) {
    elemento.textContent =
      "Nenhuma dose cadastrada.";
    return;
  }

  const hora =
    String(proxima.horario.hora).padStart(2, "0");

  const minuto =
    String(proxima.horario.minuto).padStart(2, "0");

  elemento.innerHTML =
    `${proxima.medicamento.nome}` +
    `${proxima.medicamento.dose ? " — " + proxima.medicamento.dose : ""}` +
    `<br>às ${hora}:${minuto}`;

  renderizarStatus();
}

function renderizarStatus() {

  const agora = new Date();

  const minutosAgora =
    agora.getHours() * 60 + agora.getMinutes();

  medicamentos.forEach(med => {

    med.horarios.forEach((h, indice) => {

      const elemento =
        document.getElementById(
          `status-${med.id}-${indice}`
        );

      const bloco =
        document.getElementById(
          `horario-${med.id}-${indice}`
        );

      if (!elemento || !bloco) return;

      bloco.classList.remove(
        "atrasado",
        "proximo",
        "tomado"
      );

      if (h.tomado) {

        bloco.classList.add("tomado");

        elemento.textContent =
          "Dose tomada";

        return;
      }

      const minutos =
        minutosDoDia(h.hora, h.minuto);

      if (minutos < minutosAgora) {

        bloco.classList.add("atrasado");

        elemento.textContent =
          "Horário já passou";

      } else {

        bloco.classList.add("proximo");

        elemento.textContent =
          "Aguardando";
      }

    });

  });

}

function renderizar() {

  const lista =
    document.getElementById("lista");

  lista.innerHTML = "";

  if (medicamentos.length === 0) {

    lista.innerHTML =
      `<div class="vazio">
        Nenhum medicamento cadastrado.
      </div>`;

    atualizarStatus();

    return;
  }

  medicamentos.forEach(med => {

    const div =
      document.createElement("div");

    div.className = "medicamento";

    let html = `
      <div class="nome">
        💊 ${escapeHtml(med.nome)}
      </div>
    `;

    if (med.dose) {
      html += `
        <div class="dose">
          Dose: ${escapeHtml(med.dose)}
        </div>
      `;
    }

    html += `<div class="horarios">`;

    med.horarios.forEach((h, indice) => {

      const hora =
        String(h.hora).padStart(2, "0");

      const minuto =
        String(h.minuto).padStart(2, "0");

      html += `
        <div
          id="horario-${med.id}-${indice}"
          class="horario"
        >

          <div class="info-horario">

            <strong>
              ⏰ ${hora}:${minuto}
            </strong>

            <span
              class="status"
              id="status-${med.id}-${indice}"
            >
              Aguardando
            </span>

          </div>

          <button
            class="${h.tomado
              ? "btn-desfazer"
              : "btn-tomar"}"
            onclick="marcarTomado(${med.id}, ${indice})"
          >
            ${h.tomado ? "DESFAZER" : "TOMADA"}
          </button>

        </div>
      `;

    });

    html += `</div>`;

    html += `
      <button
        class="btn-excluir"
        onclick="excluirMedicamento(${med.id})"
      >
        🗑️ EXCLUIR MEDICAMENTO
      </button>
    `;

    div.innerHTML = html;

    lista.appendChild(div);

  });

  atualizarStatus();
}

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

renderizar();

setInterval(atualizarRelogio, 1000);

atualizarRelogio();

</script>

</body>
  </html>
